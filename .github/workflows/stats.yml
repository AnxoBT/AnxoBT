name: Stats

# Genera las tarjetas de estadísticas del perfil (stats/*.svg) con la API de GitHub, sin servicios externos.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/stats.py "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git add stats
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar estadísticas"
          git push
